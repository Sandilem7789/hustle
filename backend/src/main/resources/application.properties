spring.application.name=Hustle Economy API
server.port=${PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://postgres:5432/hustle}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema changes go through Flyway (src/main/resources/db/migration). Databases created before
# Flyway are marked as version 1 on first start and never re-run the baseline.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
# Hibernate only checks the schema; every change is a Flyway migration. JPA_DDL_AUTO=update is an
# emergency switch back if a database built before Flyway fails validation on start.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.format_sql=true

r2.endpoint=https://226bbe940e4062a98f643cd74fe1490b.r2.cloudflarestorage.com
r2.bucket=${R2_BUCKET:hustle}
r2.access-key=${R2_ACCESS_KEY:}
r2.secret-key=${R2_SECRET_KEY:}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# Error bodies come from ApiExceptionHandler and SecurityConfig; never echo raw exception messages
server.error.include-message=never

# n8n report-generation webhook, fired when a facilitator clicks "Generate Report"
# on a submitted survey assignment. Leave blank to disable locally.
n8n.webhook-url=${N8N_WEBHOOK_URL:}
n8n.webhook-secret=${N8N_WEBHOOK_SECRET:}

# How long a sign-in lasts, for every token kind
auth.session-ttl-days=${AUTH_SESSION_TTL_DAYS:30}

# API access is decided by SecurityConfig and the session tokens; there are no Spring-managed users
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
