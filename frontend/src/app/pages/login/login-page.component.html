<div class="login-page">
  <div class="auth-card">

    <div class="auth-tabs">
      <button type="button" [class.auth-tab-active]="activeTab() === 'login'" (click)="activeTab.set('login')">Login</button>
      <button type="button" [class.auth-tab-active]="activeTab() === 'register'" (click)="activeTab.set('register')">Create Account</button>
    </div>

    <!-- ── Login ─────────────────────────────── -->
    <form class="auth-form" *ngIf="activeTab() === 'login'" (ngSubmit)="onLogin()" #loginForm="ngForm">
      <label>
        <span>Phone number</span>
        <input
          type="tel"
          placeholder="e.g. 0812345678"
          [(ngModel)]="loginPhone"
          name="loginPhone"
          required
          autocomplete="tel"
        />
      </label>

      <label>
        <span>Password</span>
        <div class="pwd-wrap">
          <input
            [type]="hideLoginPwd ? 'password' : 'text'"
            [(ngModel)]="loginPassword"
            name="loginPassword"
            required
            autocomplete="current-password"
          />
          <button type="button" class="pwd-toggle" (click)="hideLoginPwd = !hideLoginPwd" [attr.aria-label]="hideLoginPwd ? 'Show password' : 'Hide password'">
            {{ hideLoginPwd ? '👁️' : '🙈' }}
          </button>
        </div>
      </label>

      <p *ngIf="loginError" class="auth-error">{{ loginError }}</p>

      <button type="submit" class="auth-submit-btn" [disabled]="loginLoading()">
        {{ loginLoading() ? 'Signing in…' : 'Login' }}
      </button>
    </form>

    <!-- ── Create Account ───────────────────────── -->
    <form class="auth-form" *ngIf="activeTab() === 'register'" (ngSubmit)="onRegister()" #regForm="ngForm">
      <div class="name-row">
        <label class="half-width">
          <span>First name</span>
          <input [(ngModel)]="regFirstName" name="regFirstName" required autocomplete="given-name" />
        </label>
        <label class="half-width">
          <span>Last name</span>
          <input [(ngModel)]="regLastName" name="regLastName" required autocomplete="family-name" />
        </label>
      </div>

      <label>
        <span>Phone number</span>
        <input
          type="tel"
          placeholder="e.g. 0812345678"
          [(ngModel)]="regPhone"
          name="regPhone"
          required
          autocomplete="tel"
        />
      </label>

      <label>
        <span>Email (optional)</span>
        <input type="email" placeholder="e.g. name@gmail.com" [(ngModel)]="regEmail" name="regEmail" autocomplete="email" />
      </label>

      <label>
        <span>Password</span>
        <div class="pwd-wrap">
          <input
            [type]="hideRegPwd ? 'password' : 'text'"
            [(ngModel)]="regPassword"
            name="regPassword"
            required
            autocomplete="new-password"
          />
          <button type="button" class="pwd-toggle" (click)="hideRegPwd = !hideRegPwd" [attr.aria-label]="hideRegPwd ? 'Show password' : 'Hide password'">
            {{ hideRegPwd ? '👁️' : '🙈' }}
          </button>
        </div>
      </label>

      <label>
        <span>Confirm password</span>
        <input
          [type]="hideRegPwd ? 'password' : 'text'"
          [(ngModel)]="regConfirm"
          name="regConfirm"
          required
          autocomplete="new-password"
        />
      </label>

      <p *ngIf="regError" class="auth-error">{{ regError }}</p>

      <button type="submit" class="auth-submit-btn" [disabled]="regLoading()">
        {{ regLoading() ? 'Creating account…' : 'Create Account' }}
      </button>
    </form>

  </div>
</div>
